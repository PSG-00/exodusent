server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 300
    max-connections: 8192

spring:
  application:
    name: exodusent

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exodusent}
    username: ${SPRING_DATASOURCE_USERNAME:exodusent}
    password: ${SPRING_DATASOURCE_PASSWORD:exodusent_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true
